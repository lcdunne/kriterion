[project]
name = "kriterion"
version = "0.1.1"
description = "Library for signal detection theory analysis."
authors = [
    {name = "L",email = "56237933+lcdunne@users.noreply.github.com"}
]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
keywords = ["signal-detection", "psychophysics", "roc", "psychometrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy (>=2.4.6,<3.0.0)",
    "scipy (>=1.17.1,<2.0.0)"
]

[project.urls]
Homepage = "https://kriterion.readthedocs.io"
Repository = "https://github.com/lcdunne/kriterion"
Documentation = "https://kriterion.readthedocs.io"
Issues = "https://github.com/lcdunne/kriterion/issues"

[tool.poetry]
packages = [{include = "kriterion", from = "src"}]


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
matplotlib = "^3.10.9"
black = "^26.5.1"
isort = "^8.0.1"
jupyterlab = "^4.5.7"


[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.6"
mkdocstrings = "^1.0.4"
mkdocstrings-python = "^2.0.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"